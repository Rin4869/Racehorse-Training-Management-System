<title>Racehorse Club</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============ Tokens ============ */
:root{
  color-scheme: light;
  --bg:#f3efe3; --surface:#fffdf8; --surface-2:#eae3cd; --stripe:rgba(28,35,27,0.025);
  --ink:#1c231b; --ink-2:#4b5245; --muted:#7c7f6c;
  --border:#ddd4b7; --border-soft:#e9e2ca;
  --rail:#12251d; --rail-ink:#f3efe3; --rail-ink-dim:rgba(243,239,230,0.58);
  --rail-hover:rgba(243,239,230,0.08); --rail-active:rgba(196,148,58,0.20); --rail-border:rgba(243,239,230,0.1);
  --accent:#a97327; --accent-ink:#fffdf8; --accent-soft:#f3e2c2; --accent-soft-ink:#7a5119;
  --success:#2f6b3f; --success-bg:#e3efdd; --success-bd:#c3dab8;
  --warning:#8f6310; --warning-bg:#f6ecce; --warning-bd:#e3cd8c;
  --danger:#a13b2a; --danger-bg:#f7e0d7; --danger-bd:#e8b8a4;
  --info:#2c5c8a; --info-bg:#e1ebf5; --info-bd:#b9d0e6;
  --shadow-sm:0 1px 2px rgba(28,35,27,0.07);
  --shadow-md:0 6px 20px rgba(28,35,27,0.10), 0 1px 3px rgba(28,35,27,0.08);
  --radius:10px; --radius-sm:7px;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono','SF Mono',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#14180f; --surface:#1c2216; --surface-2:#252c1c; --stripe:rgba(238,240,230,0.02);
    --ink:#edf0e4; --ink-2:#c2c7b3; --muted:#8b9077;
    --border:#333a26; --border-soft:#2a3120;
    --rail:#0c150e; --rail-ink:#edf0e4; --rail-ink-dim:rgba(237,240,228,0.55);
    --rail-hover:rgba(237,240,228,0.08); --rail-active:rgba(214,163,70,0.22); --rail-border:rgba(237,240,228,0.08);
    --accent:#d6a346; --accent-ink:#14180a; --accent-soft:#3a2c12; --accent-soft-ink:#f0d29c;
    --success:#84c98f; --success-bg:#1e3221; --success-bd:#2f4a30;
    --warning:#e2b658; --warning-bg:#3a2f13; --warning-bd:#59481c;
    --danger:#e58e79; --danger-bg:#3a1f18; --danger-bd:#5c2e22;
    --info:#84b3de; --info-bg:#1b2836; --info-bd:#2a3c50;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
    --shadow-md:0 10px 28px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#14180f; --surface:#1c2216; --surface-2:#252c1c; --stripe:rgba(238,240,230,0.02);
  --ink:#edf0e4; --ink-2:#c2c7b3; --muted:#8b9077;
  --border:#333a26; --border-soft:#2a3120;
  --rail:#0c150e; --rail-ink:#edf0e4; --rail-ink-dim:rgba(237,240,228,0.55);
  --rail-hover:rgba(237,240,228,0.08); --rail-active:rgba(214,163,70,0.22); --rail-border:rgba(237,240,228,0.08);
  --accent:#d6a346; --accent-ink:#14180a; --accent-soft:#3a2c12; --accent-soft-ink:#f0d29c;
  --success:#84c98f; --success-bg:#1e3221; --success-bd:#2f4a30;
  --warning:#e2b658; --warning-bg:#3a2f13; --warning-bd:#59481c;
  --danger:#e58e79; --danger-bg:#3a1f18; --danger-bd:#5c2e22;
  --info:#84b3de; --info-bg:#1b2836; --info-bd:#2a3c50;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  --shadow-md:0 10px 28px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.4);
}

*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;color:var(--ink);}
p{margin:0;}
a{color:var(--info);}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:13.5px;}
::selection{background:var(--accent-soft);color:var(--accent-soft-ink);}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
.mono{font-family:var(--font-mono);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ============ Shell ============ */
#root{display:flex;min-height:100vh;width:100%;}
.rail{width:236px;flex-shrink:0;background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.rail-brand{padding:22px 20px 16px;border-bottom:1px solid var(--rail-border);}
.rail-brand .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 5px;}
.rail-brand h1{font-size:17px;color:var(--rail-ink);line-height:1.25;}
.rail-brand .sub{font-size:11px;color:var(--rail-ink-dim);margin-top:4px;font-family:var(--font-mono);}
.rail-nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:1px;}
.rail-section{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--rail-ink-dim);padding:14px 10px 6px;}
.rail-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:none;background:transparent;color:var(--rail-ink-dim);font-size:13.5px;font-weight:500;text-align:left;cursor:pointer;position:relative;width:100%;}
.rail-item:hover{background:var(--rail-hover);color:var(--rail-ink);}
.rail-item.active{background:var(--rail-active);color:var(--rail-ink);font-weight:600;}
.rail-item.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent);}
.rail-item .ico{width:16px;text-align:center;flex-shrink:0;opacity:.9;}
.rail-item .count{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:8px;min-width:17px;height:17px;padding:0 5px;display:flex;align-items:center;justify-content:center;}
.rail-foot{padding:14px 20px 18px;border-top:1px solid var(--rail-border);font-size:11px;color:var(--rail-ink-dim);line-height:1.5;}
.rail-foot strong{color:var(--rail-ink);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{height:58px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:20;}
.topbar h2{font-size:16px;flex:1;min-width:0;}
.topbar .crumb{font-size:12px;color:var(--muted);font-family:var(--font-mono);}
.page{padding:26px 28px 60px;max-width:1180px;}

/* persona + bell */
.pop-wrap{position:relative;}
.persona-btn{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:5px 10px 5px 6px;cursor:pointer;color:var(--ink);}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--rail);color:var(--accent);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font-mono);}
.persona-btn .name{font-size:12.5px;font-weight:600;}
.persona-btn .role{font-size:10.5px;color:var(--muted);}
.persona-btn .car{font-size:9px;color:var(--muted);margin-left:2px;}
.menu{position:absolute;top:calc(100% + 7px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);width:264px;overflow:hidden;z-index:60;}
.menu-head{padding:10px 14px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border-soft);}
.menu-item{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;padding:9px 14px;cursor:pointer;color:var(--ink);text-align:left;}
.menu-item:hover{background:var(--stripe);}
.menu-item.current{background:var(--accent-soft);}
.menu-item .m-name{font-size:12.5px;font-weight:600;}
.menu-item .m-role{font-size:11px;color:var(--muted);}
.bell-btn{position:relative;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex-shrink:0;}
.bell-btn .dot{position:absolute;top:-3px;right:-3px;width:16px;height:16px;border-radius:50%;background:var(--danger);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);}
.notif-panel{width:360px;max-height:420px;overflow-y:auto;}
.notif-row{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--border-soft);cursor:pointer;}
.notif-row:last-child{border-bottom:none;}
.notif-row:hover{background:var(--stripe);}
.notif-row .n-dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.notif-row .n-title{font-size:12.5px;font-weight:600;margin:0;}
.notif-row .n-msg{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45;}
.notif-row .n-time{font-size:10px;color:var(--muted);font-family:var(--font-mono);margin-top:4px;}
.notif-empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:12.5px;}

/* ============ Building blocks ============ */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
.kpi-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;}
.kpi-tile .k-num{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1;}
.kpi-tile .k-label{font-size:11.5px;color:var(--muted);margin-top:7px;font-weight:500;}
.kpi-tile.alert .k-num{color:var(--danger);}
.kpi-tile.warn .k-num{color:var(--warning);}
.kpi-tile.ok .k-num{color:var(--success);}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;overflow:hidden;}
.panel-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);}
.panel-head h3{font-size:14.5px;flex:1;}
.panel-head .hint{font-size:11.5px;color:var(--muted);}
.panel-body{padding:16px 18px;}
.panel-body.flush{padding:0;}
.two-col{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start;}
@media (max-width:880px){.two-col{grid-template-columns:1fr;}}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2.5px 8px;font-size:10.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;line-height:1.5;border:1px solid transparent;}
.pill-success{background:var(--success-bg);color:var(--success);border-color:var(--success-bd);}
.pill-warning{background:var(--warning-bg);color:var(--warning);border-color:var(--warning-bd);}
.pill-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bd);}
.pill-info{background:var(--info-bg);color:var(--info);border-color:var(--info-bd);}
.pill-neutral{background:var(--surface-2);color:var(--ink-2);border-color:var(--border);}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.search-input{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--ink);}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;}
.chip.active{background:var(--rail);color:var(--rail-ink);border-color:var(--rail);}

.list-row{display:flex;align-items:center;gap:13px;padding:13px 18px;border-bottom:1px solid var(--border-soft);cursor:pointer;}
.list-row:last-child{border-bottom:none;}
.list-row:hover{background:var(--stripe);}
.h-avatar{width:38px;height:38px;border-radius:9px;background:var(--surface-2);color:var(--ink-2);font-family:var(--font-display);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.list-row .l-main{flex:1;min-width:0;}
.list-row .l-title{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;}
.list-row .l-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.list-row .l-meta{text-align:right;flex-shrink:0;}
.lock-tag{display:inline-flex;align-items:center;gap:3px;color:var(--danger);font-size:10.5px;font-weight:700;}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted);}
.empty-state .e-icon{font-size:26px;margin-bottom:8px;opacity:.6;}
.empty-state p{font-size:12.5px;}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:600;padding:8px 14px;cursor:pointer;white-space:nowrap;}
.btn:hover{background:var(--stripe);}
.btn-primary{background:var(--rail);color:var(--rail-ink);border-color:var(--rail);}
.btn-primary:hover{filter:brightness(1.2);}
.btn-accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bd);}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:6px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

/* detail header */
.detail-back{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:12.5px;font-weight:600;margin-bottom:14px;cursor:pointer;border:none;background:none;padding:0;}
.detail-back:hover{color:var(--ink);}
.detail-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;}
.detail-avatar{width:60px;height:60px;border-radius:12px;background:var(--surface-2);color:var(--ink-2);font-family:var(--font-display);font-weight:600;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.detail-head h2{font-size:21px;}
.detail-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
.detail-tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
.detail-actions{margin-left:auto;display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}

.lock-banner{display:flex;gap:10px;align-items:flex-start;background:var(--danger-bg);border:1px solid var(--danger-bd);color:var(--danger);border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:16px;font-size:12.5px;}
.lock-banner b{display:block;font-size:13px;margin-bottom:2px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;}
.tab{border:none;background:none;padding:10px 4px;margin-right:20px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);}

.field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px 22px;}
.field label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.field .value{font-size:13.5px;font-weight:500;}
.field .value.muted{color:var(--muted);font-weight:400;}

/* forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.form-grid.one{grid-template-columns:1fr;}
.f-item{display:flex;flex-direction:column;gap:5px;min-width:0;}
.f-item.span2{grid-column:1/-1;}
.f-item label{font-size:11.5px;font-weight:600;color:var(--ink-2);}
.f-item input,.f-item select,.f-item textarea{border:1px solid var(--border);border-radius:7px;padding:8px 10px;background:var(--bg);color:var(--ink);font-size:13px;width:100%;}
.f-item textarea{resize:vertical;min-height:64px;font-family:inherit;}
.f-item .hint{font-size:11px;color:var(--muted);}
.f-check{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border-soft);}
.form-error{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-bd);border-radius:7px;padding:8px 11px;font-size:12px;margin-bottom:12px;}

/* pedigree */
.ped-tree{display:flex;flex-direction:column;gap:22px;align-items:center;padding:10px 0 4px;}
.ped-row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;width:100%;}
.ped-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 14px;min-width:150px;text-align:center;position:relative;}
.ped-card.self{border-color:var(--accent);background:var(--accent-soft);}
.ped-card .p-name{font-size:12.5px;font-weight:700;}
.ped-card .p-role{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.ped-card .p-fit{font-size:10.5px;color:var(--muted);margin-top:3px;font-family:var(--font-mono);}
.ped-card.empty{border-style:dashed;color:var(--muted);font-size:11.5px;}
.ped-gen-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:-8px;}

/* stat blocks for race history */
.race-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-soft);}
.race-row:last-child{border-bottom:none;}
.race-pos{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;}
.race-pos.win{background:var(--warning-bg);color:var(--warning);border:1px solid var(--warning-bd);}

/* table (races/admin) */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.tbl th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--border);}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl-wrap{overflow-x:auto;}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(12,16,10,0.5);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow-y:auto;}
.modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:540px;box-shadow:var(--shadow-md);margin-bottom:5vh;}
.modal-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:15px;flex:1;}
.modal-close{border:none;background:none;font-size:18px;color:var(--muted);cursor:pointer;line-height:1;padding:4px;}
.modal-body{padding:18px 20px;}
.modal-body p.lead{font-size:13px;color:var(--ink-2);margin-bottom:14px;line-height:1.55;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--rail);color:var(--rail-ink);border-radius:9px;padding:11px 16px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:8px;animation:toastin .18s ease-out;}
.toast .t-ico{color:var(--accent);}
@keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.role-note{background:var(--info-bg);color:var(--info);border:1px solid var(--info-bd);border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:16px;}

/* live-API connection state (unused in this offline mock build, harmless) */
.boot-screen{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px;}
.boot-card{max-width:440px;text-align:center;}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);margin:0 auto 16px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.boot-card h2{font-size:16px;margin-bottom:8px;}
.boot-card p{font-size:12.5px;color:var(--muted);line-height:1.6;}
.boot-card .mono{display:block;margin-top:10px;background:var(--surface-2);border-radius:6px;padding:8px 10px;word-break:break-all;text-align:left;}

<script>
(function(){
"use strict";

/* =========================================================================

   System (NestJS + Prisma API, 8 phases already implemented). No backend
   calls here — every action mutates in-memory state, matching the same
   roles, entities, statuses and business rules the real API enforces.
   Want it wired to the real running API instead? See

   ========================================================================= */

/* ---------- tiny helpers ---------- */
var uidCounters = {};
function uid(prefix){ uidCounters[prefix] = (uidCounters[prefix]||0)+1; return prefix+'-'+uidCounters[prefix]; }
function daysFromNow(n){ var d=new Date(); d.setDate(d.getDate()+n); return d; }
function iso(d){ return d.toISOString(); }
function fmtDate(v){ if(!v) return '—'; var d=new Date(v); return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDateTime(v){ if(!v) return '—'; var d=new Date(v); return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'})+' · '+d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}); }
function fmtRel(v){
  var diffMs = new Date(v).getTime() - Date.now();
  var mins = Math.round(diffMs/60000);
  var days = Math.round(diffMs/86400000);
  if (Math.abs(mins) < 60) return mins===0?'vừa xong':(mins>0?'sau '+mins+' phút':'trước '+(-mins)+' phút');
  if (Math.abs(days) < 1) { var hrs=Math.round(diffMs/3600000); return hrs>0?'sau '+hrs+' giờ':'trước '+(-hrs)+' giờ'; }
  return days>0 ? 'sau '+days+' ngày' : 'trước '+(-days)+' ngày';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function initials(name){ var p=(name||'').trim().split(/\s+/); return ((p[0]||'')[0]||'')+((p[p.length-1]||'')[0]||''); }
function byId(arr,id){ for (var i=0;i<arr.length;i++){ if(arr[i].id===id) return arr[i]; } return null; }
function pushToast(msg, icon){
  var root = document.getElementById('toast-root');
  var el = document.createElement('div');
  el.className='toast';
  el.innerHTML = '<span class="t-ico">'+(icon||'✓')+'</span><span>'+esc(msg)+'</span>';
  root.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3400);
}

/* ---------- domain vocabulary (mirrors the real API's enums) ---------- */

/* ================================ SEED DATA ================================

var HORSES = [
  { id:'thunderbolt', name:'Thunderbolt', breed:'Thoroughbred', birthDate:iso(daysFromNow(-365*5)), ownerId:'owner1',
    status:'ACTIVE', fitnessScore:78, sireId:'northern-star', damId:'silver-mist', locked:false, lockReason:null },

  { id:'silver-mist', name:'Silver Mist', breed:'Thoroughbred', birthDate:iso(daysFromNow(-365*13)), ownerId:'owner1',

var SESSIONS = [

  { id:'sess-2', horseId:'thunderbolt', trainerId:'trainer', planId:'plan-1', scheduledAt:iso(daysFromNow(-7)), type:'sprint', status:'DONE', resultMetric:'time_1200m_s', resultValue:74.2, notes:null },
  { id:'sess-3', horseId:'golden-comet', trainerId:'trainer', planId:null, scheduledAt:iso(daysFromNow(2)), type:'trot', status:'PLANNED', resultMetric:null, resultValue:null, notes:null },
  { id:'sess-4', horseId:'golden-comet', trainerId:'trainer', planId:null, scheduledAt:iso(daysFromNow(-2)), type:'gallop', status:'DONE', resultMetric:'heart_rate_recovery_s', resultValue:118, notes:'Phục hồi tốt' }
];

var PLANS = [
  { id:'plan-1', horseId:'thunderbolt', trainerId:'trainer', goal:'Xây nền thể lực cho Spring Derby 2026', startDate:iso(daysFromNow(0)), endDate:iso(daysFromNow(30)) }
];

var HEALTH_RECORDS = [
  { id:'hr-1', horseId:'thunderbolt', vetId:'vet', examDate:iso(daysFromNow(-10)), diagnosis:'Khám định kỳ — sức khoẻ tốt', treatment:null, attachmentPath:null },
  { id:'hr-2', horseId:'midnight', vetId:'vet', examDate:iso(daysFromNow(-3)), diagnosis:'Đau bụng nhẹ (colic)', treatment:'Theo dõi 24h, đã hồi phục', attachmentPath:null },
  { id:'hr-3', horseId:'thunderbolt', vetId:'vet', examDate:iso(daysFromNow(-9)), diagnosis:'Xây xát nhẹ ở vai, tự khỏi sau vài ngày', treatment:'Theo dõi tại chuồng', attachmentPath:'labresult.pdf' }

var RACES = [

  { id:'inc-2', horseId:'thunderbolt', reportedById:'groom', description:'Xây xát nhẹ ở vai, tự khỏi sau vài ngày', severity:'LOW', status:'RESOLVED', healthRecordId:'hr-3', createdAt:iso(daysFromNow(-9)) },
  { id:'inc-3', horseId:'golden-comet', reportedById:'groom', description:'Có dấu hiệu khập khiễng nhẹ chân trước sau buổi tập', severity:'MEDIUM', status:'OPEN', healthRecordId:null, createdAt:iso(daysFromNow(-1)) }

  { id:'ntf-4', userId:'owner2', type:'INCIDENT_REPORTED', message:'Sự cố mới (MEDIUM) cho Golden Comet: Có dấu hiệu khập khiễng nhẹ chân trước sau buổi tập', read:true, createdAt:iso(daysFromNow(-1)) },
  { id:'ntf-5', userId:'manager', type:'INCIDENT_REPORTED', message:'Sự cố mới (MEDIUM) cho Golden Comet: Có dấu hiệu khập khiễng nhẹ chân trước sau buổi tập', read:true, createdAt:iso(daysFromNow(-1)) },

];

var state = { USERS:USERS, HORSES:HORSES, SESSIONS:SESSIONS, PLANS:PLANS, HEALTH_RECORDS:HEALTH_RECORDS, RACES:RACES, RACE_ENTRIES:RACE_ENTRIES, INCIDENTS:INCIDENTS, NOTIFICATIONS:NOTIFICATIONS };

var ui = {
  personaId: 'manager',
  route: 'dashboard', routeParam: null,
  personaMenuOpen: false, notifOpen: false,
  horseSearch: '', horseStatusFilter: 'ALL',
  horseTab: 'profile',
  editHorse: false,
  racesTab: 'upcoming'
};

/* ---------- persistence (best-effort; demo convenience only) ---------- */
function saveLocal(){
  try{ localStorage.setItem('racehorse-demo-state', JSON.stringify(state)); }catch(e){}
}
function loadLocal(){
  try{
    var raw = localStorage.getItem('racehorse-demo-state');
    if (raw) { var parsed = JSON.parse(raw); for (var k in parsed) { if (state[k]) state[k] = parsed[k]; } }
  }catch(e){}
}

/* ---------- derived / RBAC ---------- */
function persona(){ return byId(state.USERS, ui.personaId); }
function isRole(r){ var p=persona(); return p && p.role===r; }
function ownerScopeId(){ return isRole('OWNER') ? ui.personaId : null; }
function visibleHorses(){
  var scope = ownerScopeId();
  return state.HORSES.filter(function(h){ return !scope || h.ownerId===scope; });
}
function horseVisible(h){ var scope=ownerScopeId(); return !scope || h.ownerId===scope; }
function userName(id){ var u=byId(state.USERS,id); return u? u.name : '—'; }
function horseName(id){ var h=byId(state.HORSES,id); return h? h.name : '—'; }
function managerIds(){ return state.USERS.filter(function(u){ return u.role==='MANAGER' && u.status==='ACTIVE'; }).map(function(u){ return u.id; }); }

/* ---------- notifications (mirrors NotificationsService + HorsesService.lock()) ---------- */
function notify(userIds, type, message){
  var uniq = userIds.filter(function(v,i,a){ return a.indexOf(v)===i; });
  uniq.forEach(function(userId){
    state.NOTIFICATIONS.unshift({ id:uid('ntf'), userId:userId, type:type, message:message, read:false, createdAt:iso(new Date()) });
  });
}
function setHorseLock(horseId, locked, reason){
  var h = byId(state.HORSES, horseId);
  if (!h) return;
  var changed = h.locked !== locked;
  h.locked = locked;
  h.lockReason = locked ? (reason||null) : null;
  if (changed){
    var msg = locked
      ? (h.name+' đã bị khoá tập luyện'+(h.lockReason? ': '+h.lockReason : ''))
      : (h.name+' đã được mở khoá tập luyện');
    notify([h.ownerId].concat(managerIds()), locked?'TRAINING_LOCKED':'TRAINING_UNLOCKED', msg);
  }
}

/* ================================ RENDER ================================ */
var NAV = [
  { route:'dashboard', label:'Tổng quan', icon:'◆' },
  { route:'horses', label:'Ngựa đua', icon:'▤' },
  { route:'plans', label:'Kế hoạch tập', icon:'▦' },
  { route:'races', label:'Giải đua', icon:'▲' },
  { route:'incidents', label:'Sự cố sức khoẻ', icon:'✚' },
  { route:'notifications', label:'Thông báo', icon:'●' },
  { route:'admin', label:'Người dùng', icon:'▣', roles:['MANAGER'] }
];
var PAGE_TITLE = { dashboard:'Tổng quan', horses:'Ngựa đua', plans:'Kế hoạch tập luyện', races:'Giải đua', incidents:'Sự cố sức khoẻ', notifications:'Thông báo', admin:'Quản lý người dùng' };

function root(){ return document.getElementById('root'); }

function render(){
  var focusInfo = captureFocus();
  var p = persona();
  var myNotifs = state.NOTIFICATIONS.filter(function(n){ return n.userId===ui.personaId; });
  var unread = myNotifs.filter(function(n){ return !n.read; }).length;
  var openIncidents = state.INCIDENTS.filter(function(i){ return i.status!=='RESOLVED'; }).length;

  var pageTitle = ui.route==='horses' && ui.routeParam ? horseName(ui.routeParam) : PAGE_TITLE[ui.route];

  var html = ''
    + railHtml(p)
    + '<div class="main">'
    +   topbarHtml(p, pageTitle, unread, myNotifs)
    +   '<div class="page">' + pageHtml() + '</div>'
    + '</div>';

  root().innerHTML = html;
  restoreFocus(focusInfo);
  saveLocal();
}

function railHtml(p){
  var items = NAV.map(function(item){
    if (item.roles && (!p || item.roles.indexOf(p.role)===-1)) return '';
    var active = ui.route===item.route;
    var count = '';
    if (item.route==='incidents'){
      var n = state.INCIDENTS.filter(function(i){ return i.status!=='RESOLVED'; }).length;
      if (n>0) count = '<span class="count">'+n+'</span>';
    }
    if (item.route==='notifications'){
      var un = state.NOTIFICATIONS.filter(function(x){ return x.userId===ui.personaId && !x.read; }).length;
      if (un>0) count = '<span class="count">'+un+'</span>';
    }
    if (item.route==='admin'){
      var pend = state.USERS.filter(function(u){ return u.status==='PENDING'; }).length;
      if (pend>0) count = '<span class="count">'+pend+'</span>';
    }
    return '<button class="rail-item'+(active?' active':'')+'" data-action="nav" data-route="'+item.route+'">'
      + '<span class="ico">'+item.icon+'</span><span>'+item.label+'</span>'+count+'</button>';
  }).join('');

  return '<aside class="rail">'
    + '<div class="rail-brand"><p class="eyebrow">Racehorse Club</p><h1>Training &amp; Management</h1>'
    + '<p class="sub">demo build · dữ liệu mẫu</p></div>'
    + '<nav class="rail-nav">'+items+'</nav>'
    + '<div class="rail-foot">Đăng nhập với vai <strong>'+ROLE_LABEL[p.role]+'</strong><br>để thấy đúng quyền &amp; thao tác của vai trò đó.</div>'
    + '</aside>';
}

function topbarHtml(p, title, unread, myNotifs){
  var roleMenu = state.USERS.filter(function(u){ return u.role; }).map(function(u){
    return '<button class="menu-item'+(u.id===ui.personaId?' current':'')+'" data-action="set-persona" data-id="'+u.id+'">'
      + '<span class="avatar">'+initials(u.name)+'</span>'
      + '<span><span class="m-name">'+esc(u.name)+'</span><br><span class="m-role">'+ROLE_LABEL[u.role]+'</span></span></button>';
  }).join('');

  var notifRows = myNotifs.slice(0,8).map(function(n){
    var meta = NOTIF_LABEL[n.type];
    var dotColor = n.type==='TRAINING_LOCKED' ? 'var(--danger)' : (n.type==='INCIDENT_REPORTED' ? 'var(--warning)' : 'var(--success)');
    return '<div class="notif-row" data-action="open-notif" data-id="'+n.id+'">'
      + '<span class="n-dot" style="background:'+dotColor+(n.read?';opacity:.35':'')+'"></span>'
      + '<div style="flex:1;min-width:0;"><p class="n-title">'+meta.icon+' '+meta.l+'</p>'
      + '<p class="n-msg">'+esc(n.message)+'</p><p class="n-time">'+fmtRel(n.createdAt)+'</p></div></div>';
  }).join('') || '<div class="notif-empty">Chưa có thông báo nào.</div>';

  return '<header class="topbar">'
    + '<h2>'+esc(title)+'</h2>'
    + '<div class="pop-wrap">'
    +   '<button class="bell-btn" data-action="toggle-notif">🔔'+(unread>0?'<span class="dot">'+unread+'</span>':'')+'</button>'
    +   (ui.notifOpen? '<div class="menu notif-panel"><div class="menu-head">Thông báo của bạn</div>'+notifRows+'</div>' : '')
    + '</div>'
    + '<div class="pop-wrap">'
    +   '<button class="persona-btn" data-action="toggle-persona"><span class="avatar">'+initials(p.name)+'</span>'
    +   '<span><span class="name">'+esc(p.name)+'</span><br><span class="role">'+ROLE_LABEL[p.role]+'</span></span><span class="car">▾</span></button>'
    +   (ui.personaMenuOpen? '<div class="menu"><div class="menu-head">Đăng nhập với vai trò khác (demo)</div>'+roleMenu+'</div>' : '')
    + '</div>'
    + '</header>';
}

function pageHtml(){
  switch (ui.route){
    case 'horses': return ui.routeParam ? horseDetailPage(ui.routeParam) : horsesListPage();
    case 'plans': return plansPage();
    case 'races': return racesPage();
    case 'incidents': return incidentsPage();
    case 'notifications': return notificationsPage();
    case 'admin': return adminPage();
    default: return dashboardPage();
  }
}

/* ---------- Dashboard ---------- */
function dashboardPage(){
  var horses = visibleHorses();
  var lockedCount = horses.filter(function(h){ return h.locked; }).length;
  var openInc = state.INCIDENTS.filter(function(i){ return i.status!=='RESOLVED' && horseVisible(byId(state.HORSES,i.horseId)); }).length;
  var upcoming = state.SESSIONS.filter(function(s){ return s.status==='PLANNED' && horseVisible(byId(state.HORSES,s.horseId)); })
    .sort(function(a,b){ return new Date(a.scheduledAt)-new Date(b.scheduledAt); }).slice(0,5);
  var pendingUsers = state.USERS.filter(function(u){ return u.status==='PENDING'; }).length;

  var kpis = [
    { num: horses.length, label:'Tổng số ngựa', k:'' },
    { num: lockedCount, label:'Đang bị khoá tập luyện', k: lockedCount>0?'alert':'ok' },
    { num: openInc, label:'Sự cố chưa xử lý', k: openInc>0?'warn':'ok' },
    { num: upcoming.length, label:'Buổi tập sắp tới', k:'' }
  ];
  if (isRole('MANAGER')) kpis.push({ num: pendingUsers, label:'Tài khoản chờ duyệt', k: pendingUsers>0?'warn':'ok' });

  var kpiHtml = kpis.map(function(k){ return '<div class="kpi-tile '+k.k+'"><div class="k-num tnum">'+k.num+'</div><div class="k-label">'+k.label+'</div></div>'; }).join('');

  var horseRows = horses.slice(0,6).map(function(h){ return horseListRow(h); }).join('') || emptyState('Chưa có ngựa nào trong phạm vi của bạn.');

  var sessionRows = upcoming.map(function(s){
    var h = byId(state.HORSES,s.horseId);
    return '<div class="list-row" data-action="nav" data-route="horses" data-id="'+s.horseId+'">'
      + '<div class="h-avatar">'+esc((h&&h.name||'?')[0])+'</div>'
      + '<div class="l-main"><div class="l-title">'+esc(h?h.name:'—')+' <span class="pill pill-neutral">'+esc(s.type)+'</span></div>'
      + '<div class="l-sub">'+fmtDateTime(s.scheduledAt)+'</div></div>'
      + '<div class="l-meta">'+pill(SESSION_STATUS[s.status])+'</div></div>';
  }).join('') || emptyState('Không có buổi tập nào sắp diễn ra.');

  return ''
    + roleNote()
    + '<div class="kpi-grid">'+kpiHtml+'</div>'
    + '<div class="two-col">'
    +   '<div class="panel"><div class="panel-head"><h3>Ngựa trong CLB</h3><span class="hint">'+horses.length+' con</span></div>'
    +     '<div class="panel-body flush">'+horseRows+'</div></div>'
    +   '<div class="panel"><div class="panel-head"><h3>Buổi tập sắp tới</h3></div>'
    +     '<div class="panel-body flush">'+sessionRows+'</div></div>'
    + '</div>';
}

function horseListRow(h){

  return '<div class="list-row" data-action="nav" data-route="horses" data-id="'+h.id+'">'
    + '<div class="h-avatar">'+esc(h.name[0])+'</div>'

    + '<div class="l-sub">'+esc(h.breed)+' · Chủ: '+esc(owner)+'</div></div>'

function pill(cfg){ return '<span class="pill pill-'+cfg.k+'">'+cfg.l+'</span>'; }
function emptyState(msg){ return '<div class="empty-state"><div class="e-icon">—</div><p>'+esc(msg)+'</p></div>'; }

/* ---------- Horses list ---------- */
function horsesListPage(){
  var horses = visibleHorses().filter(function(h){
    if (ui.horseStatusFilter!=='ALL' && h.status!==ui.horseStatusFilter) return false;
    if (ui.horseSearch && h.name.toLowerCase().indexOf(ui.horseSearch.toLowerCase())===-1) return false;
    return true;
  });
  var filters = ['ALL','ACTIVE','RESTING','RETIRED'].map(function(s){
    var label = s==='ALL' ? 'Tất cả' : HORSE_STATUS[s].l;
    return '<button class="chip'+(ui.horseStatusFilter===s?' active':'')+'" data-action="horse-filter" data-status="'+s+'">'+label+'</button>';
  }).join('');

  var rows = horses.map(horseListRow).join('') || emptyState('Không tìm thấy ngựa phù hợp.');

  return ''
    + roleNote()
    + '<div class="toolbar">'
    +   '<input id="horse-search" class="search-input" type="text" placeholder="Tìm theo tên ngựa…" value="'+esc(ui.horseSearch)+'" data-action="horse-search">'
    +   '<div class="chip-row">'+filters+'</div>'
    +   (can('createHorse') ? '<button class="btn btn-primary" data-action="open-modal" data-modal="add-horse">+ Thêm ngựa</button>' : '')
    + '</div>'
    + '<div class="panel"><div class="panel-body flush">'+rows+'</div></div>';
}

/* ---------- Horse detail ---------- */
function horseDetailPage(id){
  var h = byId(state.HORSES, id);
  if (!h || !horseVisible(h)){
    return backLink('horses') + emptyState('Không tìm thấy ngựa này, hoặc bạn không có quyền xem.');
  }
  var owner = userName(h.ownerId);
  var tabs = [
    { id:'profile', label:'Hồ sơ' },
    { id:'pedigree', label:'Phả hệ' },
    { id:'achievements', label:'Thành tích' },
    { id:'health', label:'Sức khoẻ &amp; Tập luyện' }
  ];
  var tabBtns = tabs.map(function(t){
    return '<button class="tab'+(ui.horseTab===t.id?' active':'')+'" data-action="horse-tab" data-tab="'+t.id+'">'+t.label+'</button>';
  }).join('');

  var actions = '';
  if (can('editHorse')) actions += '<button class="btn btn-sm" data-action="open-modal" data-modal="edit-horse" data-id="'+h.id+'">✎ Sửa hồ sơ</button>';
  if (can('setLock')){
    actions += h.locked
      ? '<button class="btn btn-sm btn-accent" data-action="unlock-horse" data-id="'+h.id+'">🔓 Mở khoá tập luyện</button>'
      : '<button class="btn btn-sm btn-danger" data-action="open-modal" data-modal="lock-horse" data-id="'+h.id+'">🔒 Khoá tập luyện</button>';
  }

  var body = '';
  if (ui.horseTab==='profile') body = horseProfileTab(h, owner);
  else if (ui.horseTab==='pedigree') body = horsePedigreeTab(h);
  else if (ui.horseTab==='achievements') body = horseAchievementsTab(h);
  else body = horseHealthTab(h);

  return ''
    + backLink('horses')
    + '<div class="detail-head">'
    +   '<div class="detail-avatar">'+esc(h.name[0])+'</div>'
    +   '<div style="flex:1;min-width:0;"><h2>'+esc(h.name)+'</h2>'
    +   '<div class="detail-sub">'+esc(h.breed)+' · '+ageLabel(h.birthDate)+' tuổi · Chủ sở hữu: '+esc(owner)+'</div>'
    +   '<div class="detail-tags">'+pill(HORSE_STATUS[h.status])+(h.locked?'<span class="pill pill-danger">🔒 Khoá tập luyện</span>':'')+
          (h.fitnessScore!=null? '<span class="pill pill-neutral">Thể trạng '+h.fitnessScore+'/100</span>':'')+'</div></div>'
    +   '<div class="detail-actions">'+actions+'</div>'
    + '</div>'
    + (h.locked ? '<div class="lock-banner">🔒<div><b>Đang bị khoá tập luyện</b>'+esc(h.lockReason||'')+'<br><span style="opacity:.85">Huấn luyện viên không thể tạo buổi tập mới cho tới khi bác sĩ thú y mở khoá.</span></div></div>' : '')
    + '<div class="tabs">'+tabBtns+'</div>'
    + body;
}
function backLink(route){ return '<button class="detail-back" data-action="nav" data-route="'+route+'">← Danh sách ngựa</button>'; }
function ageLabel(birthDate){ if(!birthDate) return '?'; var yrs = Math.floor((Date.now()-new Date(birthDate).getTime())/(365.25*86400000)); return yrs; }

function horseProfileTab(h, owner){
  return '<div class="panel"><div class="panel-body">'
    + '<div class="field-grid">'
    +   field('Giống', esc(h.breed||'—'))
    +   field('Ngày sinh', fmtDate(h.birthDate))
    +   field('Trạng thái', pill(HORSE_STATUS[h.status]))
    +   field('Chủ sở hữu', esc(owner))
    +   field('Điểm thể trạng', h.fitnessScore!=null ? h.fitnessScore+' / 100' : '<span class="value muted">Chưa đánh giá</span>')
    +   field('Mã hồ sơ', '<span class="mono">'+h.id+'</span>')
    + '</div></div></div>';
}
function field(label, valueHtml){
  return '<div class="field"><label>'+label+'</label><div class="value">'+valueHtml+'</div></div>';
}

function horsePedigreeTab(h){
  var sire = h.sireId ? byId(state.HORSES,h.sireId) : null;
  var dam = h.damId ? byId(state.HORSES,h.damId) : null;
  var gsire = sire && sire.sireId ? byId(state.HORSES,sire.sireId) : null;
  var gdam1 = sire && sire.damId ? byId(state.HORSES,sire.damId) : null;
  var dsire = dam && dam.sireId ? byId(state.HORSES,dam.sireId) : null;
  var ddam = dam && dam.damId ? byId(state.HORSES,dam.damId) : null;

  function pedCard(horse, role, self){
    if (!horse) return '<div class="ped-card empty">Chưa có dữ liệu '+role+'</div>';
    return '<div class="ped-card'+(self?' self':'')+'" data-action="nav" data-route="horses" data-id="'+horse.id+'" style="cursor:pointer;">'
      + '<div class="p-name">'+esc(horse.name)+'</div><div class="p-role">'+role+'</div>'
      + (horse.fitnessScore!=null? '<div class="p-fit">Thể trạng '+horse.fitnessScore+'</div>':'')+'</div>';
  }

  var editRow = can('editHorse') ? '<div class="btn-row" style="margin-top:16px;">'
    + '<button class="btn btn-sm" data-action="open-modal" data-modal="edit-pedigree" data-id="'+h.id+'">✎ Gán bố / mẹ</button></div>' : '';

  return '<div class="panel"><div class="panel-head"><h3>Cây phả hệ (3 đời)</h3><span class="hint">Giới hạn 3 thế hệ, giống hệ thống thật</span></div>'
    + '<div class="panel-body">'
    + '<div class="ped-tree">'
    +   '<div class="ped-gen-label">Đời ông / bà</div>'
    +   '<div class="ped-row">'+pedCard(gsire,'Ông nội')+pedCard(gdam1,'Bà nội')+pedCard(dsire,'Ông ngoại')+pedCard(ddam,'Bà ngoại')+'</div>'
    +   '<div class="ped-gen-label">Đời cha / mẹ</div>'
    +   '<div class="ped-row">'+pedCard(sire,'Cha (Sire)')+pedCard(dam,'Mẹ (Dam)')+'</div>'
    +   '<div class="ped-gen-label">Ngựa hiện tại</div>'
    +   '<div class="ped-row">'+pedCard(h,'',true)+'</div>'
    + '</div>' + editRow
    + '</div></div>';
}

function horseAchievementsTab(h){
  var entries = state.RACE_ENTRIES.filter(function(e){ return e.horseId===h.id; }).map(function(e){
    var race = byId(state.RACES, e.raceId);
    return { race:race, entry:e };
  }).sort(function(a,b){ return new Date(b.race.date)-new Date(a.race.date); });

  var wins = entries.filter(function(x){ return x.entry.position===1; }).length;

  var rows = entries.map(function(x){
    var pos = x.entry.position;
    return '<div class="race-row">'
      + '<div class="race-pos'+(pos===1?' win':'')+'">'+(pos!=null?('#'+pos):'—')+'</div>'
      + '<div style="flex:1;"><div style="font-weight:600;font-size:13px;">'+esc(x.race.name)+'</div>'
      + '<div class="l-sub">'+fmtDate(x.race.date)+' · '+esc(x.race.venue||'')+' · '+x.race.distance+'m</div></div>'
      + '<div class="l-meta mono" style="font-size:12px;">'+(x.entry.time||'—')+'</div></div>';
  }).join('') || emptyState('Ngựa chưa tham gia giải đua nào.');

  return '<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);max-width:460px;">'
    + '<div class="kpi-tile"><div class="k-num tnum">'+entries.length+'</div><div class="k-label">Lần tham gia</div></div>'
    + '<div class="kpi-tile ok"><div class="k-num tnum">'+wins+'</div><div class="k-label">Về nhất</div></div>'
    + '<div class="kpi-tile"><div class="k-num tnum">'+(h.fitnessScore!=null?h.fitnessScore:'—')+'</div><div class="k-label">Điểm thể trạng</div></div>'
    + '</div>'
    + '<div class="panel"><div class="panel-head"><h3>Lịch sử thi đấu</h3></div><div class="panel-body flush">'+rows+'</div></div>';
}

function horseHealthTab(h){
  var sessions = state.SESSIONS.filter(function(s){ return s.horseId===h.id; }).sort(function(a,b){ return new Date(a.scheduledAt)-new Date(b.scheduledAt); });
  var plans = state.PLANS.filter(function(p){ return p.horseId===h.id; });
  var records = state.HEALTH_RECORDS.filter(function(r){ return r.horseId===h.id; }).sort(function(a,b){ return new Date(b.examDate)-new Date(a.examDate); });
  var incidents = state.INCIDENTS.filter(function(i){ return i.horseId===h.id; }).sort(function(a,b){ return new Date(b.createdAt)-new Date(a.createdAt); });

  var planRows = plans.map(function(p){
    return '<div class="list-row" style="cursor:default;"><div class="h-avatar" style="border-radius:50%;">▦</div>'
      + '<div class="l-main"><div class="l-title">'+esc(p.goal)+'</div>'
      + '<div class="l-sub">'+fmtDate(p.startDate)+' → '+(p.endDate?fmtDate(p.endDate):'không giới hạn')+' · HLV: '+esc(userName(p.trainerId))+'</div></div></div>';
  }).join('') || emptyState('Chưa có kế hoạch tập nào.');

  var sessionRows = sessions.map(function(s){
    var canUpdate = can('updateSession') && s.status==='PLANNED';
    var updateBtns = canUpdate ? '<div class="btn-row">'
      + '<button class="btn btn-sm btn-accent" data-action="open-modal" data-modal="complete-session" data-id="'+s.id+'">Đánh dấu hoàn thành</button>'
      + '<button class="btn btn-sm" data-action="cancel-session" data-id="'+s.id+'">Huỷ</button></div>' : '';
    return '<div class="list-row" style="cursor:default;align-items:flex-start;">'
      + '<div class="h-avatar" style="border-radius:50%;">●</div>'
      + '<div class="l-main"><div class="l-title">'+esc(s.type)+' '+pill(SESSION_STATUS[s.status])+'</div>'
      + '<div class="l-sub">'+fmtDateTime(s.scheduledAt)+(s.planId?' · thuộc kế hoạch':'')+
        (s.status==='DONE'? ' · '+esc(s.resultMetric)+' = '+s.resultValue : '')+
        (s.notes? '<br>'+esc(s.notes):'')+'</div>'+updateBtns+'</div></div>';
  }).join('') || emptyState('Chưa có buổi tập nào.');

  var recordRows = records.map(function(r){
    return '<div class="list-row" style="cursor:default;align-items:flex-start;">'
      + '<div class="h-avatar" style="border-radius:50%;">✚</div>'
      + '<div class="l-main"><div class="l-title">'+esc(r.diagnosis)+'</div>'
      + '<div class="l-sub">'+fmtDate(r.examDate)+' · BS: '+esc(userName(r.vetId))+
        (r.treatment? '<br>Điều trị: '+esc(r.treatment):'')+
        (r.attachmentPath? '<br>📎 '+esc(r.attachmentPath):'')+'</div></div></div>';
  }).join('') || emptyState('Chưa có hồ sơ khám nào.');

  var incidentRows = incidents.map(function(i){
    var updateBtn = can('updateIncident') && i.status!=='RESOLVED'
      ? '<button class="btn btn-sm" data-action="open-modal" data-modal="update-incident" data-id="'+i.id+'">Cập nhật xử lý</button>' : '';
    return '<div class="list-row" style="cursor:default;align-items:flex-start;">'
      + '<div class="h-avatar" style="border-radius:50%;">'+INCIDENT_SEVERITY[i.severity].k.slice(0,1).toUpperCase()+'</div>'
      + '<div class="l-main"><div class="l-title">'+esc(i.description)+' '+pill(INCIDENT_SEVERITY[i.severity])+' '+pill(INCIDENT_STATUS[i.status])+'</div>'
      + '<div class="l-sub">'+fmtDate(i.createdAt)+' · Báo cáo bởi: '+esc(userName(i.reportedById))+
        (i.healthRecordId? '<br>Gắn hồ sơ khám: '+esc((byId(state.HEALTH_RECORDS,i.healthRecordId)||{}).diagnosis||''):'')+
        '</div>'+(updateBtn?'<div class="btn-row" style="margin-top:6px;">'+updateBtn+'</div>':'')+'</div></div>';
  }).join('') || emptyState('Chưa ghi nhận sự cố nào.');

  return ''
    + '<div class="panel"><div class="panel-head"><h3>Kế hoạch tập luyện</h3>'
    +   (can('createPlan') ? '<button class="btn btn-sm btn-primary" data-action="open-modal" data-modal="create-plan" data-id="'+h.id+'">+ Kế hoạch</button>' : '')
    + '</div><div class="panel-body flush">'+planRows+'</div></div>'

    + '<div class="panel"><div class="panel-head"><h3>Buổi tập</h3>'
    +   (can('createSession') ? '<button class="btn btn-sm btn-primary" data-action="open-modal" data-modal="create-session" data-id="'+h.id+'"'+(h.locked?' disabled':'')+'>+ Buổi tập</button>' : '')
    + '</div><div class="panel-body flush">'+sessionRows+'</div></div>'

    + '<div class="panel"><div class="panel-head"><h3>Hồ sơ khám bệnh</h3>'
    +   (can('createHealthRecord') ? '<button class="btn btn-sm btn-primary" data-action="open-modal" data-modal="create-record" data-id="'+h.id+'">+ Hồ sơ khám</button>' : '')
    + '</div><div class="panel-body flush">'+recordRows+'</div></div>'

    + '<div class="panel"><div class="panel-head"><h3>Sự cố đã báo cáo</h3>'
    +   (can('createIncident') ? '<button class="btn btn-sm btn-primary" data-action="open-modal" data-modal="report-incident" data-id="'+h.id+'">+ Báo cáo sự cố</button>' : '')
    + '</div><div class="panel-body flush">'+incidentRows+'</div></div>';
}

        +   (e.time ? '<span class="mono" style="font-size:11.5px;">'+esc(e.time)+'</span>' : '')
        +   (canEdit ? '<button class="btn btn-sm" data-action="open-modal" data-modal="edit-entry" data-id="'+e.id+'">Sửa</button>' : '')
        + '</div></div>';
    }).join('') || emptyState('Chưa có ngựa đăng ký.');

    return '<div class="panel"><div class="panel-head"><h3>'+esc(r.name)+'</h3><span class="hint">'+fmtDate(r.date)+'</span></div>'

/* ================================ RBAC ================================ */
function can(action){
  var p = persona(); if (!p) return false;
  switch(action){
    case 'createHorse': case 'editHorse': case 'manageRaces': case 'approveUsers': return p.role==='MANAGER';
    case 'setLock': case 'createHealthRecord': case 'updateIncident': return p.role==='VET';
    case 'createSession': case 'updateSession': case 'createPlan': return p.role==='TRAINER' || (action==='updateSession' && p.role==='GROOM');
    case 'createIncident': return p.role==='GROOM';
    default: return false;
  }
}

}

    var v = formValues(el); var h = byId(state.HORSES, el.dataset.id);
    var sireId = v.sireId||null, damId = v.damId||null;
    if (sireId===h.id || damId===h.id){ pushToast('Ngựa không thể là cha/mẹ của chính nó','⚠'); return; }
    if (sireId && damId && sireId===damId){ pushToast('Cha và mẹ không được là cùng 1 con','⚠'); return; }
    h.sireId=sireId; h.damId=damId; closeModal(); render(); pushToast('Đã cập nhật phả hệ');
  },
  'confirm-lock': function(el){
    var v = formValues(el); var h = byId(state.HORSES, el.dataset.id);
    setHorseLock(h.id, true, v.reason||'Không rõ lý do'); closeModal(); render(); pushToast(h.name+' đã bị khoá tập luyện','🔒');
  },
  'save-session': function(el){
    var v = formValues(el); var horseId = el.dataset.id; var h = byId(state.HORSES, horseId);
    if (h.locked){ pushToast('Ngựa đang bị khoá tập luyện: '+(h.lockReason||''), '⚠'); return; }
    state.SESSIONS.push({ id:uid('sess'), horseId:horseId, trainerId:ui.personaId, planId: v.planId||null,
      scheduledAt:new Date(v.scheduledAt).toISOString(), type:v.type, status:'PLANNED', resultMetric:null, resultValue:null, notes:v.notes||null });
    closeModal(); render(); pushToast('Đã tạo buổi tập mới');
  },
  'complete-session-submit': function(el){
    var v = formValues(el); var s = byId(state.SESSIONS, el.dataset.id);
    s.status='DONE'; s.resultMetric=v.resultMetric; s.resultValue=Number(v.resultValue);
    closeModal(); render(); pushToast('Đã ghi nhận kết quả buổi tập');
  },
  'save-plan': function(el){
    var v = formValues(el);
    state.PLANS.push({ id:uid('plan'), horseId:v.horseId, trainerId:ui.personaId, goal:v.goal,
      startDate:new Date(v.startDate).toISOString(), endDate:v.endDate?new Date(v.endDate).toISOString():null });
    closeModal(); render(); pushToast('Đã tạo kế hoạch tập luyện');
  },
  'save-record': function(el){
    var v = formValues(el); var horseId = el.dataset.id;
    state.HEALTH_RECORDS.push({ id:uid('hr'), horseId:horseId, vetId:ui.personaId, examDate:new Date(v.examDate).toISOString(),
      diagnosis:v.diagnosis, treatment:v.treatment||null, attachmentPath:null });
    closeModal(); render(); pushToast('Đã lưu hồ sơ khám');
  },
  'save-incident': function(el){
    var v = formValues(el); var horseId = el.dataset.id; var h = byId(state.HORSES, horseId);
    var inc = { id:uid('inc'), horseId:horseId, reportedById:ui.personaId, description:v.description, severity:v.severity,
      status:'OPEN', healthRecordId:null, createdAt: iso(new Date()) };
    state.INCIDENTS.unshift(inc);
    if (v.severity==='HIGH') setHorseLock(horseId, true, 'Incident: '+v.description);
    notify([h.ownerId].concat(managerIds()), 'INCIDENT_REPORTED', 'Sự cố mới ('+v.severity+') cho '+h.name+': '+v.description);
    closeModal(); render(); pushToast('Đã gửi báo cáo sự cố'+(v.severity==='HIGH'?' — ngựa đã tự động bị khoá':''), '⚠');
  },
  'update-incident-submit': function(el){
    var v = formValues(el); var inc = byId(state.INCIDENTS, el.dataset.id); var h = byId(state.HORSES, inc.horseId);
    inc.status = v.status; inc.healthRecordId = v.healthRecordId || null;
    if (v.status==='RESOLVED' && h.locked) setHorseLock(h.id, false, null);
    closeModal(); render(); pushToast('Đã cập nhật xử lý sự cố');
  },
  'save-race': function(el){
    var v = formValues(el);
    state.RACES.push({ id:uid('race'), name:v.name, date:new Date(v.date).toISOString(), venue:v.venue||null,
      distance: v.distance?Number(v.distance):null, surface:v.surface||null, prizePool:null });
    closeModal(); render(); pushToast('Đã tạo giải đua mới');
  },
  'save-entry': function(el){
    var v = formValues(el); var raceId = el.dataset.id;
    if (!v.horseId) { closeModal(); return; }
    var dup = state.RACE_ENTRIES.some(function(e){ return e.raceId===raceId && e.horseId===v.horseId; });
    if (dup){ pushToast('Ngựa này đã đăng ký giải này rồi','⚠'); return; }
    state.RACE_ENTRIES.push({ id:uid('entry'), raceId:raceId, horseId:v.horseId, position:null, time:null });
    closeModal(); render(); pushToast('Đã đăng ký tham gia giải');
  },
  'save-entry-result': function(el){
    var v = formValues(el); var entry = byId(state.RACE_ENTRIES, el.dataset.id);
    entry.position = v.position!==''? Number(v.position) : null; entry.time = v.time||null;
    closeModal(); render(); pushToast('Đã lưu kết quả thi đấu');
  },
  'toggle-user': function(el){
    var u = byId(state.USERS, el.dataset.id); u.status = u.status==='ACTIVE'?'DISABLED':'ACTIVE'; render();
    pushToast(u.status==='ACTIVE'?'Đã mở khoá tài khoản':'Đã khoá tài khoản');
  },
  'approve-user-submit': function(el){
    var v = formValues(el); var u = byId(state.USERS, el.dataset.id);
    u.role = v.role; u.status='ACTIVE'; closeModal(); render(); pushToast('Đã duyệt tài khoản '+u.name);
  }
};

/* ================================ EVENT WIRING ================================ */
function captureFocus(){
  var el = document.activeElement;
  if (!el || !el.id) return null;
  var info = { id: el.id, start: null, end: null };
  if (typeof el.selectionStart === 'number'){ info.start = el.selectionStart; info.end = el.selectionEnd; }
  return info;
}
function restoreFocus(info){
  if (!info) return;
  var el = document.getElementById(info.id);
  if (!el) return;
  el.focus();
  if (info.start!=null && el.setSelectionRange){ try{ el.setSelectionRange(info.start, info.end); }catch(e){} }
}

document.addEventListener('click', function(e){
  var overlay = e.target.closest('.overlay');
  if (overlay && e.target===overlay){ closeModal(); return; }
  var trigger = e.target.closest('[data-action]');
  if (!trigger) return;
  var action = trigger.dataset.action;
  if (trigger.tagName==='FORM') return; // handled by submit
  if (trigger.hasAttribute('disabled')) return;
  if (ACTIONS[action]) { e.preventDefault(); ACTIONS[action](trigger, e); }
});

document.addEventListener('submit', function(e){
  var form = e.target.closest('form[data-action]');
  if (!form) return;
  e.preventDefault();
  var action = form.dataset.action;
  if (ACTIONS[action]) ACTIONS[action](form, e);
});

document.addEventListener('input', function(e){
  if (e.target.id==='horse-search') ACTIONS['horse-search'](e.target);
});

document.addEventListener('keydown', function(e){
  if (e.key==='Escape') closeModal();
});

/* click-away for popovers (persona menu / notif panel) */
document.addEventListener('click', function(e){
  if (!e.target.closest('.pop-wrap')){
    if (ui.personaMenuOpen || ui.notifOpen){ ui.personaMenuOpen=false; ui.notifOpen=false; render(); }
  }
}, true);

/* ================================ ROUTER ================================ */
function syncFromHash(){
  var h = location.hash.replace(/^#\/?/, '');
  var parts = h.split('/').filter(Boolean);
  ui.route = parts[0] || 'dashboard';
  ui.routeParam = parts[1] || null;
  if (!PAGE_TITLE[ui.route]) ui.route = 'dashboard';
}
window.addEventListener('hashchange', function(){ syncFromHash(); render(); });

/* ================================ BOOT ================================ */
function start(hotData){
  if (hotData && hotData.state) { try{ for (var k in hotData.state) if (state[k]) state[k]=hotData.state[k]; ui = hotData.ui || ui; }catch(e){} }
  else { loadLocal(); }
  syncFromHash();
  render();
}
try{
  if (window.claude && window.claude.hot){
    window.claude.hot.ready ? window.claude.hot.ready(function(){ start(window.claude.hot.data); }) : start(window.claude.hot.data);
  } else { start(null); }
}catch(e){ start(null); }

})();
</script>
